<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-size: 2.5rem;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            animation: fadeIn 2s ease-in-out;
        }

        p {
            font-size: 1.2rem;
            color: #e0e0e0;
            margin-bottom: 15px;
            animation: fadeIn 3s ease-in-out;
        }

        /* Estilo para el corazón latiendo */
        .heart {
            font-size: 2rem;
            color: #ff4d4d;
            margin-bottom: 30px;
            display: inline-block;
            animation: heartbeat 1.2s infinite ease-in-out, fadeIn 3s ease-in-out;
            text-shadow: 0 0 10px rgba(255, 77, 77, 0.6);
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
        }

        /* Contenedor del Ramo Central */
        .bouquet {
            position: relative;
            width: 200px;
            height: 300px;
            margin: 0 auto;
        }

        /* Estilo base de cada flor del ramo */
        .flower {
            position: absolute;
            animation: bloom 1s ease-in-out forwards;
            opacity: 0;
            transform: scale(0);
        }

        .flower1 { top: 20px; left: 50px; animation-delay: 0.5s; }
        .flower2 { top: 0px; left: 100px; animation-delay: 0.8s; }
        .flower3 { top: 30px; right: 40px; animation-delay: 1.1s; }
        .flower4 { top: 80px; left: 20px; animation-delay: 1.4s; }
        .flower5 { top: 90px; right: 20px; animation-delay: 1.7s; }

        /* Centro de la flor */
        .center {
            width: 30px;
            height: 30px;
            background-color: #5c3a21;
            border-radius: 50%;
            position: absolute;
            top: 35px;
            left: 35px;
            z-index: 2;
        }

        /* Pétalos */
        .petals {
            position: relative;
            width: 100px;
            height: 100px;
        }

        .petal {
            position: absolute;
            width: 35px;
            height: 55px;
            background: linear-gradient(to top, #ffcc00, #ffee55);
            border-radius: 50% 50% 20% 20%;
            top: 15px;
            left: 32px;
            transform-origin: bottom center;
        }

        .petal:nth-child(1) { transform: rotate(0deg); }
        .petal:nth-child(2) { transform: rotate(45deg); }
        .petal:nth-child(3) { transform: rotate(90deg); }
        .petal:nth-child(4) { transform: rotate(135deg); }
        .petal:nth-child(5) { transform: rotate(180deg); }
        .petal:nth-child(6) { transform: rotate(225deg); }
        .petal:nth-child(7) { transform: rotate(270deg); }
        .petal:nth-child(8) { transform: rotate(315deg); }

        /* Tallos del ramo central */
        .stem {
            position: absolute;
            width: 6px;
            height: 180px;
            background-color: #4CAF50;
            top: 90px;
            left: 97px;
            z-index: -1;
            border-radius: 3px;
        }

        /* Flores flotantes de fondo animadas solo con CSS */
        .bg-flower {
            position: absolute;
            width: 70px;
            height: 70px;
            pointer-events: none;
            z-index: 1;
            animation: floatUp 7s linear infinite;
            opacity: 0;
        }

        .bg-flower .center {
            width: 21px;
            height: 21px;
            top: 24.5px;
            left: 24.5px;
        }

        .bg-flower .petals {
            width: 70px;
            height: 70px;
        }

        .bg-flower .petal {
            width: 24.5px;
            height: 38.5px;
            top: 10.5px;
            left: 22.4px;
        }

        /* Posiciones horizontales y tiempos diferidos */
        .bg1 { left: 10%; animation-delay: 0s; }
        .bg2 { left: 25%; animation-delay: 2s; }
        .bg3 { left: 45%; animation-delay: 4s; }
        .bg4 { left: 65%; animation-delay: 1.5s; }
        .bg5 { left: 80%; animation-delay: 3.5s; }
        .bg6 { left: 92%; animation-delay: 5.5s; }

        /* Animaciones */
        @keyframes bloom {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.4) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.7;
            }
            80% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) scale(0.9) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Flores flotantes en el fondo (CSS Puro) -->
    <div class="bg-flower bg1">
        <div class="center"></div>
        <div class="petals">
            <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
            <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
        </div>
    </div>
    <div class="bg-flower bg2">

    </div>
    <div class="bg-flower bg3">

    <div class="bg-flower bg4">

            <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>

    </div>
    <div class="bg-flower bg6">
        <div class="center"></div>
        <div class="petals">
            <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
            <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
        </div>
    </div>

    <!-- Contenido Principal -->
    <div class="container">
        <h1>¡Tus flores amarillas Socia!</h1>
        <p>Un detalle especial para ti</p>
        <div class="heart">❤️</div>

        <div class="bouquet">
            <div class="stem" style="height: 190px; transform: rotate(-5deg);"></div>
            <div class="stem" style="height: 200px; transform: rotate(5deg);"></div>
            <div class="stem" style="height: 170px; transform: rotate(0deg);"></div>

            <!-- Flor 1 -->
            <div class="flower flower1">
                <div class="center"></div>
                <div class="petals">
                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>

                </div>
            </div>
            <!-- Flor 2 -->
            <div class="flower flower2">

                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>
                </div>
            </div>
            <!-- Flor 3 -->
            <div class="flower flower3">
                <div class="center"></div>
                <div class="petals">

                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>

            <!-- Flor 4 -->
            <div class="flower flower4">

                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>

            <!-- Flor 5 -->
            <div class="flower flower5">

                <div class="petals">

                    <div class="petal"></div><div class="petal"></div><div class="petal"></div><div class="petal"></div>

        </div>
    </div>

</body>
</html>
